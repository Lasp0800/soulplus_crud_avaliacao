<div class="cliente-list">
  <div class="row">
    <div class="col-sm-12">
      <div class="content-header">Lista de clientes</div>
      <p class="content-sub-header">
        Informe o filtro desejado e selecione um item para executar uma ação
      </p>
    </div>
  </div>

  <section id="ngx-datatable-filter">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-content">
            <div class="card-body">
              <ngx-spinner
                size="default"
                type="ball-clip-rotate-pulse"
                [name]="'listaCliente'"
                [fullScreen]="false"
              ></ngx-spinner>

              <!-- ngx-datatable-filter -->
              <fieldset class="form-group new-cliente">
                <label for="ngx-filter-ref"
                  >Buscar:
                  <input
                    id="ngx-filter-ref"
                    class="form-control form-control-sm d-inline-block width-300"
                    type="text"
                    placeholder="Filtro pelo nome do cliente..."
                    (keyup)="filterUpdate($event)"
                    #search
                  />
                </label>
                <button class="btn btn-primary" (click)="newCliente(detailsContent)">
                  <i class="ft-plus"></i>
                  Novo cliente
                </button>
              </fieldset>
              <ngx-datatable
                *ngIf="rows && rows.length"
                class="bootstrap core-bootstrap header-height-50"
                [rows]="rows"
                [columnMode]="ColumnMode.force"
                [headerHeight]="50"
                [footerHeight]="50"
                rowHeight="auto"
                [limit]="10"
                [scrollbarH]="true"
              >
                <ngx-datatable-column name="Nome" prop="name" [width]="200">
                  <ng-template
                    let-row="row"
                    let-name="value"
                    let-rowIndex="rowIndex"
                    ngx-datatable-cell-template
                  >
                    <div class="d-flex align-items-center">
                      <div class="image-area-table mr-1">
                        <img
                          class="rounded-circle"
                          src="{{ row.urlFoto }}"
                          height="32"
                          width="32"
                          alt=""
                          onerror="this.style.display='none';"
                        />
                        <div class="fallback-avatar">{{ name[0] }}</div>
                      </div>
                      <div class="cell-line-height">
                        <p class="font-medium-1 line-height-1 mb-0">{{ name }}</p>
                      </div>
                    </div>
                  </ng-template>
                </ngx-datatable-column>
                <ngx-datatable-column
                  name="Email"
                  prop="email"
                  [width]="250"
                ></ngx-datatable-column>
                <ngx-datatable-column
                  name="Telefone"
                  prop="telefone"
                  [width]="150"
                ></ngx-datatable-column>
                <ngx-datatable-column name="Ações" [width]="70">
                  <ng-template ngx-datatable-cell-template let-row="row">
                    <i
                      class="ft-edit text-primary cursor-pointer mr-2"
                      (click)="editCliente(row, detailsContent)"
                    ></i>
                    <i
                      class="ft-trash-2 text-primary cursor-pointer mr-2"
                      (click)="deleteCliente(row)"
                    ></i>
                  </ng-template>
                </ngx-datatable-column>
              </ngx-datatable>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <ng-template #detailsContent let-c="close" let-d="dismiss">
    <div class="modal-header">
      <h4 class="modal-title">Cliente</h4>
      <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <ngx-spinner
        size="default"
        type="ball-clip-rotate-pulse"
        [name]="'newCliente'"
        [fullScreen]="false"
      ></ngx-spinner>
      <form [formGroup]="form">
        <div class="row">
          <div class="col-12 col-md-6 left-container">
            <div class="mb-2 image-container">
              <img class="cliente-photo" alt="" [src]="clientePhoto" />
            </div>
            <div
              class="col-12 d-flex flex-sm-row flex-column justify-content-center button-container"
            >
              <label class="btn btn-sm bg-light-primary mb-sm-0" for="select-files"
                >Enviar foto</label
              >
              <input
                type="file"
                id="select-files"
                (change)="selectFile($event, cropModal)"
                hidden
              />
              <button class="btn btn-sm bg-light-secondary ml-sm-2" (click)="removePhoto()">
                Limpar
              </button>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="controls">
              <h6>Nome</h6>
              <input
                type="text"
                formControlName="name"
                class="form-control"
                placeholder="Nome"
                [ngClass]="{
                  'is-invalid': formSubmitted && f.name.invalid,
                  'is-valid': formSubmitted && !f.name.invalid
                }"
                required
              />
              <div
                *ngIf="formSubmitted && (f.name.invalid || f.name.errors?.required)"
                class="help-block mt-1 text-danger d-flex align-items-center"
              >
                <i class="ft-alert-circle align-middle"></i>Campo obrigatório
              </div>
            </div>
            <div class="controls mt-2">
              <h6>Email</h6>
              <input
                type="text"
                formControlName="email"
                class="form-control"
                placeholder="Email"
                [ngClass]="{
                  'is-invalid': formSubmitted && f.email.invalid,
                  'is-valid': formSubmitted && !f.email.invalid
                }"
                required
              />
              <div
                *ngIf="formSubmitted && (f.email.invalid || f.email.errors?.required)"
                class="help-block mt-1 text-danger d-flex align-items-center"
              >
                <i class="ft-alert-circle align-middle"></i>Campo obrigatório
              </div>
            </div>
            <div class="controls mt-2">
              <h6>Telefone</h6>
              <input
                type="text"
                formControlName="telefone"
                class="form-control"
                placeholder="Telefone"
                [ngClass]="{
                  'is-invalid': formSubmitted && f.telefone.invalid,
                  'is-valid': formSubmitted && !f.telefone.invalid
                }"
                required
              />
              <div
                *ngIf="formSubmitted && (f.telefone.invalid || f.telefone.errors?.required)"
                class="help-block mt-1 text-danger d-flex align-items-center"
              >
                <i class="ft-alert-circle align-middle"></i>Campo obrigatório
              </div>
            </div>
            <div class="controls mt-2">
              <h6>Endereço</h6>
              <input
                type="text"
                formControlName="endereco"
                class="form-control"
                placeholder="Endereço"
                [ngClass]="{
                  'is-invalid': formSubmitted && f.endereco.invalid,
                  'is-valid': formSubmitted && !f.endereco.invalid
                }"
              />
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" (click)="saveCliente()">Salvar Cliente</button>
      <button type="button" class="btn btn-secondary" (click)="c('Close click')">Fechar</button>
    </div>
  </ng-template>

  <ng-template #cropModal let-c="close" let-d="dismiss">
    <div class="modal-header">
      <h4 class="modal-title">Recortar Imagem</h4>
      <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="row">
        <div class="col-12 col-md-6 left-container">
          <div class="mb-2 image-container">
            <image-cropper
              [imageChangedEvent]="imageChangedEvent"
              [maintainAspectRatio]="true"
              [aspectRatio]="1 / 1"
              resizeToWidth="200"
              resizeToHeight="200"
              format="png"
              (imageCropped)="imageCropped($event)"
              (imageLoaded)="imageLoaded()"
              (cropperReady)="cropperReady()"
              (loadImageFailed)="loadImageFailed()"
            ></image-cropper>
          </div>
        </div>
        <div class="col-12 col-md-6 d-flex justify-content-center align-items-center">
          <img class="cliente-photo" alt="" [src]="croppedImage" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" (click)="cropImage()">Salvar Imagem</button>
      <button type="button" class="btn btn-secondary" (click)="c('Close click')">Fechar</button>
    </div>
  </ng-template>
</div>
